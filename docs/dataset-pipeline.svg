<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Custom apple dataset creation pipeline</title>
  <desc id="desc">Fuji polygon annotations and MinneApple instance masks are converted into normalized YOLO bounding box labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3e8"/>
      <stop offset="1" stop-color="#e7f1ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173b35" flood-opacity=".15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2d6a5d"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <text x="70" y="72" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#173b35">Creating the custom apple dataset</text>
  <text x="70" y="108" font-family="Arial, sans-serif" font-size="18" fill="#4d625c">From source annotations to YOLO object-detection labels</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="300" height="170" rx="14" fill="#ffffff" stroke="#b9d3c8" stroke-width="2"/>
    <rect x="450" y="165" width="300" height="170" rx="14" fill="#ffffff" stroke="#b9d3c8" stroke-width="2"/>
    <rect x="830" y="165" width="300" height="170" rx="14" fill="#ffffff" stroke="#b9d3c8" stroke-width="2"/>
    <rect x="260" y="430" width="300" height="140" rx="14" fill="#ffffff" stroke="#b9d3c8" stroke-width="2"/>
    <rect x="640" y="430" width="300" height="140" rx="14" fill="#ffffff" stroke="#b9d3c8" stroke-width="2"/>
  </g>

  <path d="M370 250 H440" stroke="#2d6a5d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M750 250 H820" stroke="#2d6a5d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M980 340 V395 H790 V420" stroke="#2d6a5d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 500 H630" stroke="#2d6a5d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M410 340 V395 H490 V420" stroke="#2d6a5d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif" fill="#173b35">
    <text x="100" y="210" font-size="22" font-weight="700">1. Collect sources</text>
    <text x="100" y="245" font-size="17">Fuji: image + polygon CSV</text>
    <text x="100" y="275" font-size="17">MinneApple: image + instance mask</text>
    <text x="100" y="305" font-size="15" fill="#657873">Keep matching image and annotation names</text>

    <text x="480" y="210" font-size="22" font-weight="700">2. Organize</text>
    <text x="480" y="245" font-size="17">Create train/ and test/ folders</text>
    <text x="480" y="275" font-size="17">Move images and annotations together</text>
    <text x="480" y="305" font-size="15" fill="#657873">Remove empty or unmatched records</text>

    <text x="860" y="210" font-size="22" font-weight="700">3. Read annotation</text>
    <text x="860" y="245" font-size="17">Polygon points or mask instances</text>
    <text x="860" y="275" font-size="17">Find each apple's pixel bounds</text>
    <text x="860" y="305" font-size="15" fill="#657873">Class id: 0 (apple)</text>

    <text x="290" y="475" font-size="22" font-weight="700">4. Convert</text>
    <text x="290" y="510" font-size="17">xmin, xmax, ymin, ymax</text>
    <text x="290" y="540" font-size="17">Normalize by image width/height</text>

    <text x="670" y="475" font-size="22" font-weight="700">5. Validate and train</text>
    <text x="670" y="510" font-size="17">Draw boxes over sample images</text>
    <text x="670" y="540" font-size="17">Zip appledataset for YOLO training</text>
  </g>
</svg>
